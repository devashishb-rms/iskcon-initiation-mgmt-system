# Local development and single-server deployment.
#   docker compose up -d postgres minio        # just the backing services (what `pnpm db:up` does)
#   docker compose --profile app up --build    # also run the API in a container
name: iskcon-initiation

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: iskcon
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-iskcon}
      POSTGRES_DB: iskcon
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iskcon -d iskcon"]
      interval: 5s
      timeout: 3s
      retries: 20

  # S3-compatible object store for candidates' documents. Any S3 service can replace it (set S3_* in .env).
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports: ["9000:9000", "9001:9001"]
    volumes: ["miniodata:/data"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER:-minioadmin} $${MINIO_ROOT_PASSWORD:-minioadmin} &&
      mc mb --ignore-existing local/iskcon-documents &&
      mc anonymous set none local/iskcon-documents"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}

  api:
    profiles: ["app"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    depends_on:
      postgres: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql://iskcon:${POSTGRES_PASSWORD:-iskcon}@postgres:5432/iskcon
      RUN_MIGRATIONS_ON_BOOT: "true"
      STORAGE_DRIVER: s3
      S3_BUCKET: iskcon-documents
      S3_ENDPOINT: http://minio:9000
      S3_FORCE_PATH_STYLE: "true"
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports: ["4000:4000"]

volumes:
  pgdata:
  miniodata:
