# Added by the ISKCON Initiation Management System installer. A separate server block on its own port:
# it does not share a server_name or port with any other site.
server {
    listen @PUBLIC_PORT@;
    listen [::]:@PUBLIC_PORT@;
    server_name _;

    client_max_body_size 12m;          # documents up to 10 MB plus form overhead
    server_tokens off;

    location / {
        proxy_pass http://127.0.0.1:@WEB_PORT@;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
